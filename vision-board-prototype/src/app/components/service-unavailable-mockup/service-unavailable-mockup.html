<div class="su-page">
  <div class="su">
    <img class="su__illustration" src="illustration-wet-floor-sign.png" alt="" aria-hidden="true" />

    <h1 class="su__headline">It&rsquo;s not you, it&rsquo;s our wiring.</h1>
    <p class="su__body">
      We&rsquo;re having a quick hiccup connecting to our home listings right now. Your account is safe&mdash;just
      give us a few minutes to get things back in order.
    </p>

    @if (stillDown()) {
      <p class="su__still-down">
        <app-icon name="info" color="#8a5a00" />
        Still having trouble &mdash; we&rsquo;ll keep trying in the background.
      </p>
    }

    <button type="button" class="su__retry-btn" [disabled]="retrying()" (click)="retry()">
      @if (retrying()) {
        <span class="su__spinner"></span> Trying again&hellip;
      } @else {
        Try Again
      }
    </button>
    <a class="su__support-link" (click)="contactSupport()">Contact Support</a>
  </div>
</div>
