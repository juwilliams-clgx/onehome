<div class="vision-board__grid">
  @for (photo of visionBoard.pinnedPhotos(); track photo.id) {
    <div class="vision-board__tile">
      <img [src]="photo.url" [alt]="photo.room" />
      <button
        type="button"
        class="icon-chip vision-board__unpin"
        [attr.aria-label]="'Unpin ' + photo.room"
        title="Unpin"
        (click)="unpin(photo)"
      >
        <app-icon name="unpin" />
      </button>
    </div>
  }
  @if (!visionBoard.isFull()) {
    <label
      class="vision-board__tile vision-board__tile--upload"
      [class.vision-board__tile--dragging]="isDragging()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <input type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
      <app-icon name="plus" />
      <span class="vision-board__upload-text">Add an Image</span>
    </label>
  }
</div>
